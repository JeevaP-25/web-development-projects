<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container{
            height: 300px;
            width: 500px;
            border: solid 2px black;
            border-radius: 10px;
            position: relative;
            display: flex;
        }

        #container:hover{
            background-color: darkgray;
            transition-property: background;
            transition-timing-function: ease-in-out;
            transition-duration: 0.5s;
        }
        #one{
            height: 150px;
            width: 150px;
            background-color: red;
            position: absolute;
            right: 50px;
            bottom: 50px; 
            z-index: 1;
            transition-property: height,width,background;
            transition-duration: 0.7s,0.7s,1s;
            transition-timing-function: ease-in-out;

        }
        #one:hover{
            height: 200px;
            width: 200px;
            background-color: aqua;

        }
        #two{
            height: 150px;
            width: 150px;
            background-color: blue;
            position: absolute;
            z-index: 2;
            top: 20px;
            left: 50px;
        }
        #three{
            height: 150px;
            width: 150px;
            background-color: teal;
            position: absolute;
            top: 80px;
            left: 60px;
            

        }
       
    </style>
</head>
<body>
    <div id="container">
        <div id="one"></div>
        <div id="two"></div>
        <div id="three"></div>
    </div>
    <div id="four"></div>
</body>
</html>
