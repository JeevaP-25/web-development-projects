<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>bookMan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Zalando+Sans+Expanded:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h2 id="bookman">BookMan</h2>
    </header>
    <div id="container">
        <div id="books">
            <h2 class="bookname">Alchemist</h2>
            <h4 class="author">Paulo Coelho</h4>
            <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Saepe omnis repellat quibusdam eum suscipit praesentium ea, non ducimus odio rem.</p>
            <button id="delete">Delete</button>
        </div>
    </div>
    <div id="overlay"></div>
    <div id="con">
    <div id="popup">
        <form>
        <h2 class="bookman">Add Book</h2>
        <input type="text" id="booktitle">
        <input type="text" id="bookauthor">
        <input type="text" id="des">
        <button id="popadd">Add</button>
        <button id="popcan">Cancel</button>
        </form>
    </div>
    </div>
    <div id="foot">
        <button id="add">+</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
